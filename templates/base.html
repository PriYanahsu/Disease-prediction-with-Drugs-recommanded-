<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MediGuide{% endblock %}</title>
  <meta name="theme-color" content="#0b5fff">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% if show_nav %}
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <span>MediGuide</span>
          <small>ML workspace</small>
        </div>
      </a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="nav-links">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Predict</a>
        <a href="{{ url_for('view_tests') }}" class="{% if request.endpoint == 'view_tests' %}active{% endif %}">History</a>
        <a href="{{ url_for('analytics') }}" class="{% if request.endpoint == 'analytics' %}active{% endif %}">Analytics</a>
        <a href="{{ url_for('logout') }}" class="danger">Logout</a>
      </nav>
    </div>
  </header>
  {% endif %}

  {% block body %}{% endblock %}

  <div id="predict-overlay" class="predict-overlay" hidden aria-hidden="true">
    <div class="predict-overlay-card">
      <div class="spinner" aria-hidden="true"></div>
      <h2>Running inference</h2>
      <ol class="overlay-pipeline">
        <li class="on">Clean + lemmatize text</li>
        <li class="on">TF-IDF vectorize</li>
        <li class="on">PassiveAggressive classify</li>
        <li>Rank drugs by rating</li>
      </ol>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
